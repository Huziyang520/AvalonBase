license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# displayURL / issueTrackerURL / iconFile are mod-specific and MUST live in
# the [[mods]] table; placed at the top level NeoForge silently ignores them
# and the mod-list homepage button stays disabled.
# 26.2+ NeoForge splits the mod-list artwork into two slots: iconFile (square
# 1:1 icon shown in the LEFT list) and bannerFile (wide banner shown on the
# RIGHT detail page). We only ship a 1:1 icon, so use iconFile -- using the
# deprecated logoFile would render the square icon in the RIGHT banner slot.
displayURL = "https://www.curseforge.com/minecraft/mc-mods/avalonbase"
issueTrackerURL = "https://github.com/Huziyang520/AvalonBase/issues"
iconFile = "assets/avalonbase/textures/avalonbase.png"
authors = "${mod_author}"
description = '''
[EN] A shared support library providing GUI themes, a config framework and networking for other mods.
[CN] 共享支持库：为其他模组提供 GUI 主题、配置框架与网络功能。
'''
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"