modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# displayURL / issueTrackerURL / iconFile / logoFile are mod-specific and MUST live in
# the [[mods]] table; placed at the top level NeoForge silently ignores them
# and the mod-list homepage button stays disabled.
# 26.2+ NeoForge splits the mod-list artwork into two slots (iconFile = square 1:1 icon
# in the left list, bannerFile = wide banner on the right). 26.1.x and earlier only know
# the deprecated logoFile. This branch spans 26.1~26.2, so both keys are declared:
# 26.2+ picks iconFile, 26.1.x falls back to logoFile. We only ship a 1:1 icon.
displayURL = "https://www.curseforge.com/minecraft/mc-mods/avalonbase"
issueTrackerURL = "https://github.com/Huziyang520/AvalonBase/issues"
iconFile = "assets/avalonbase/textures/avalonbase.png"
logoFile = "assets/avalonbase/textures/avalonbase.png"
authors = "${mod_author}"
description = '''
[EN] A shared support library providing GUI themes, a config framework and networking for other mods.
[CN] 共享支持库：为其他模组提供 GUI 主题、配置框架与网络功能。
'''
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_loader_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
