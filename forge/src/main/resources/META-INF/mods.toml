modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
# displayURL / issueTrackerURL are mod-specific and MUST live in the [[mods]] table;
# at the top level javafml silently ignores them and the mod-list homepage button stays disabled.
displayURL = "https://www.curseforge.com/minecraft/mc-mods/avalonbase"
issueTrackerURL = "https://github.com/Huziyang520/AvalonBase/issues"
logoFile = "assets/avalonbase/textures/avalonbase.png"
authors = "${mod_author}"
description = '''${description}'''
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
